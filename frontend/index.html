<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coursnote</title>
<link rel="stylesheet" href="assets/styles.css?v=69">
<link rel="stylesheet" href="assets/toolbar.css">
<script>
  // Runs before first paint so user never sees the default dark theme flash.
  // Must be inline — no external file, no async, no defer.
  (function () {
    try {
      var u = JSON.parse(localStorage.getItem('coursnote_user'));
      if (!u || !u.settings) return;
      var s = u.settings;
      var r = document.documentElement;
      function toRGB(hex) {
        if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
        var n = parseInt(hex.slice(1), 16);
        return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
      }
      var bg = toRGB(s.backgroundColour), bl = toRGB(s.primaryColour), pur = toRGB(s.gradientColour);
      if (bg)  r.style.setProperty('--col-bg',     bg);
      if (bl)  r.style.setProperty('--col-blue',   bl);
      if (pur) r.style.setProperty('--col-purple', pur);
      if (s.navColour)             r.style.setProperty('--col-nav',    s.navColour);
      if (s.cardColour)            r.style.setProperty('--col-card',   s.cardColour);
      if (s.textColour)            r.style.setProperty('--col-text',   s.textColour);
      if (s.accentColour)          r.style.setProperty('--col-border', s.accentColour);
      if (s.secondaryTextColour)   r.style.setProperty('--col-text2',  s.secondaryTextColour);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div id="app-loading" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px">
  <div style="width:10px;height:10px;border-radius:50%;background:rgb(var(--col-blue));animation:_ld .9s ease-in-out infinite"></div>
  <div style="width:10px;height:10px;border-radius:50%;background:rgb(var(--col-blue));animation:_ld .9s ease-in-out .2s infinite"></div>
  <div style="width:10px;height:10px;border-radius:50%;background:rgb(var(--col-blue));animation:_ld .9s ease-in-out .4s infinite"></div>
</div>
<style>@keyframes _ld{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}</style>

<nav id="sidebar">
  <div id="sidebar-header">
    <h2>Coursnote</h2>
    <p>Your course notes</p>
  </div>
  <div id="sidebar-nav"></div>
  <div id="sidebar-footer"></div>
</nav>

<main id="main"></main>

<div id="toast"></div>
<input type="file" id="nb-image-input" accept="image/*" style="display:none">


<div class="modal-overlay" id="modal-overlay" onmousedown="modalOverlayClick(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-title" id="modal-title"></div>

    <div class="modal-body" id="modal-course">
      <div class="form-row">
        <div class="field"><label>Name</label><input id="cf-name" placeholder="e.g. Data Structures" /></div>
        <div class="field"><label>Description</label><input id="cf-desc" placeholder="What's this course about?" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="cf-submit">Create</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <div class="modal-body" id="modal-module">
      <div class="form-row">
        <div class="field"><label>Name</label><input id="mf-name" placeholder="e.g. Week 3 — Sorting" /></div>
        <div class="field"><label>Description</label><input id="mf-desc" placeholder="Brief overview…" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="mf-submit">Create</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <div class="modal-body" id="modal-topic">
      <div class="form-row">
        <div class="field"><label>Name</label><input id="tf-name" placeholder="e.g. Binary Search Trees" /></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="tf-submit">Create</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <div class="modal-body" id="modal-versions">
      <div id="modal-versions-list"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      </div>
    </div>

    <div class="modal-body" id="modal-confirm">
      <p id="modal-confirm-msg"></p>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger" id="modal-confirm-ok">Delete</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
  require(['vs/editor/editor.main'], function() {
    window.dispatchEvent(new Event('monaco-ready'));
  });
</script>
<script type="module" src="/main.js"></script>
<script src="assets/config.js"></script>
<script src="assets/storage.js"></script>
<script src="assets/runtime.js"></script>
<script src="assets/state.js"></script>
<script src="assets/api.js"></script>
<script src="assets/utils.js"></script>
<script src="assets/data.js"></script>
<script src="assets/notebook.js?v=6"></script>
<script src="assets/save.js"></script>
<script src="assets/completion.js"></script>
<script src="assets/views.js"></script>
<script src="assets/render.js"></script>
<script src="assets/forms.js"></script>
<script src="assets/actions.js"></script>
<script src="assets/market.js"></script>
<script src="assets/publish.js"></script>
<script src="assets/navigation.js"></script>
<script src="assets/boot.js"></script>
</body>
</html>
